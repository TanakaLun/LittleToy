name: CI Build

on:
  push:
  workflow_dispatch:
    inputs:
      build_all:
        type: choice
        description: '选择编译类型'
        required: true
        default: 'both'
        options:
          - 'both'
          - 'debug'
          - 'release'
      custom_version_name:
        type: string
        description: '自定义版本名称（可选，留空则使用短提交哈希）'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.build_all == 'both' || github.event.inputs.build_all == 'debug'
    outputs:
      build_timestamp: ${{ steps.build_info.outputs.build_timestamp }}
    env:
      BUILD_TYPE: "debug"
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🛠️ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 💻 Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
      
      - name: ⚙️ Calculate Version Info
        id: version_info
        env:
          COMMIT_ID: ${{ github.sha }}
        run: |
          COMMIT_ID_SHORT=${COMMIT_ID::7}
          echo "commit_short=$COMMIT_ID_SHORT" >> $GITHUB_OUTPUT
          
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((COMMIT_COUNT + 1))
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.custom_version_name }}" ]]; then
            VERSION_NAME="${{ github.event.inputs.custom_version_name }}"
            echo "Using custom version name: $VERSION_NAME"
          else
            VERSION_NAME="$COMMIT_ID_SHORT"
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          
          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"
      
      - name: 🛠️ Modify Gradle Build File
        run: |
          GRADLE_FILE="app/build.gradle.kts"
          
          echo "Found gradle file: $GRADLE_FILE"
                    
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode = ${{ steps.version_info.outputs.version_code }}/g" "$GRADLE_FILE"
          sed -i -E "s/versionName[[:space:]]+'[^']*'/versionName = \"${{ steps.version_info.outputs.version_name }}\"/g" "$GRADLE_FILE"
          
          echo "Modified versionCode to: ${{ steps.version_info.outputs.version_code }}"
          echo "Modified versionName to: ${{ steps.version_info.outputs.version_name }}"
          
          echo "Modified lines in build.gradle.kts:"
          grep -n "versionCode\|versionName" "$GRADLE_FILE" || true
         
      
      - name: ⚙️ Grant execute permission to gradlew
        run: chmod +x gradlew
      
      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug
      
      - name: 📦 Find and rename APK files
        id: build_info
        env:
          COMMIT_SHORT: ${{ steps.version_info.outputs.commit_short }}
          VERSION_CODE: ${{ steps.version_info.outputs.version_code }}
        run: |
          BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> $GITHUB_OUTPUT

          UPLOAD_DIR="${{ github.workspace }}/upload-artifacts"
          mkdir -p "$UPLOAD_DIR"
          
          APK_FILES=$(find ${{ github.workspace }}/app/build/outputs/apk/debug/ -name "*.apk")
          
          APK_COUNT=0
          for apk in $APK_FILES; do
            filename=$(basename "$apk")
            
            if [[ "$filename" == *"armeabi-v7a"* ]]; then
              ABI="armeabi-v7a"
            elif [[ "$filename" == *"arm64-v8a"* ]]; then
              ABI="arm64-v8a"
            elif [[ "$filename" == *"universal"* ]]; then
              ABI="universal"
            else
              ABI="arm64-v8a"
            fi
            
            NEW_APK_NAME="SnakeEVO-${ABI}-debug-v${VERSION_CODE}-${COMMIT_SHORT}.apk"
            NEW_APK_PATH="$UPLOAD_DIR/$NEW_APK_NAME"
            
            cp "$apk" "$NEW_APK_PATH"
            echo "Copied and renamed APK to: $NEW_APK_PATH"
            
            APK_COUNT=$((APK_COUNT + 1))
          done
          
          echo "apk_dir=$UPLOAD_DIR" >> $GITHUB_OUTPUT
          echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT
          echo "Found and processed $APK_COUNT APK files"
      
      - name: 📤 Upload Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnakeEVO-debug-v${{ steps.version_info.outputs.version_code }}
          path: ${{ steps.build_info.outputs.apk_dir }}/*
          retention-days: 7

  build-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.build_all == 'both' || github.event.inputs.build_all == 'release'
    outputs:
      build_timestamp: ${{ steps.build_info.outputs.build_timestamp }}
    env:
      BUILD_TYPE: "release"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g'"
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🛠️ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 💻 Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
      
      - name: ⚙️ Calculate Version Info
        id: version_info
        env:
          COMMIT_ID: ${{ github.sha }}
        run: |
          COMMIT_ID_SHORT=${COMMIT_ID::7}
          echo "commit_short=$COMMIT_ID_SHORT" >> $GITHUB_OUTPUT
          
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((COMMIT_COUNT + 1))
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.custom_version_name }}" ]]; then
            VERSION_NAME="${{ github.event.inputs.custom_version_name }}"
            echo "Using custom version name: $VERSION_NAME"
          else
            VERSION_NAME="$COMMIT_ID_SHORT"
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          
          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"
      
      - name: 🛠️ Modify Gradle Build File
        run: |
          GRADLE_FILE="app/build.gradle.kts"
          
          echo "Found gradle file: $GRADLE_FILE"
                    
          sed -i -E "s/versionCode = 1/versionCode = ${{ steps.version_info.outputs.version_code }}/g" "$GRADLE_FILE"
          sed -i -E "s/versionName = \"1.0\"/versionName = \"${{ steps.version_info.outputs.version_name }}\"/g" "$GRADLE_FILE"
          
          echo "Modified versionCode to: ${{ steps.version_info.outputs.version_code }}"
          echo "Modified versionName to: ${{ steps.version_info.outputs.version_name }}"
          
          echo "Modified lines in build.gradle.kts:"
          grep -n "versionCode\|versionName" "$GRADLE_FILE" || true
         
      
      - name: ⚙️ Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Export keystore.properties
        run: |
          echo "${{ secrets.PASSWORD }}" | base64 -d > keystore.properties
          chmod -x keystore.properties
          
          echo "${{ secrets.KEY }}" | base64 -d > app/TanakaLun.keystore
          chmod -x app/TanakaLun.keystore
                
      - name: 🏗️ Build Release APK
        run: ./gradlew assembleRelease
      
      - name: 📦 Find and rename APK files
        id: build_info
        env:
          COMMIT_SHORT: ${{ steps.version_info.outputs.commit_short }}
          VERSION_CODE: ${{ steps.version_info.outputs.version_code }}
        run: |
          BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> $GITHUB_OUTPUT

          UPLOAD_DIR="${{ github.workspace }}/upload-artifacts"
          mkdir -p "$UPLOAD_DIR"
          
          APK_FILES=$(find ${{ github.workspace }}/app/build/outputs/apk/release/ -name "*.apk")
          
          APK_COUNT=0
          for apk in $APK_FILES; do
            filename=$(basename "$apk")
            
            if [[ "$filename" == *"armeabi-v7a"* ]]; then
              ABI="armeabi-v7a"
            elif [[ "$filename" == *"arm64-v8a"* ]]; then
              ABI="arm64-v8a"
            elif [[ "$filename" == *"universal"* ]]; then
              ABI="universal"
            else
              ABI="arm64-v8a"
            fi
            
            NEW_APK_NAME="SnakeEVO-${ABI}-release-v${VERSION_CODE}-${COMMIT_SHORT}.apk"
            NEW_APK_PATH="$UPLOAD_DIR/$NEW_APK_NAME"
            
            cp "$apk" "$NEW_APK_PATH"
            echo "Copied and renamed APK to: $NEW_APK_PATH"
            
            APK_COUNT=$((APK_COUNT + 1))
          done
          
          echo "apk_dir=$UPLOAD_DIR" >> $GITHUB_OUTPUT
          echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT
          echo "Found and processed $APK_COUNT APK files"
      
      - name: 📤 Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnakeEVO-release-v${{ steps.version_info.outputs.version_code }}
          path: ${{ steps.build_info.outputs.apk_dir }}/*
          retention-days: 7